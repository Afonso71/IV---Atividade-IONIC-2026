<ion-view view-title="Acesso Acadêmico" hide-nav-bar="true">
  <ion-content scroll="true">
    <div class="login-viewport">
      <div class="login-shell">
        <div class="login-top-strip">
          <span class="inst-tag">Universidade Católica do Salvador</span>
          <h1>Portal do Aluno</h1>
          <p>Autoatendimento Acadêmico e Financeiro</p>
        </div>

        <div class="login-form-body">
          <div class="error-banner" ng-if="erroLogin">
            <i class="icon ion-alert-circled"></i> {{ erroLogin }}
          </div>

          <div class="field-group">
            <label class="field-label">Matrícula Institucional</label>
            <input
              type="text"
              class="field-input mono-code"
              placeholder="Ex.: 20261001"
              ng-model="credenciais.matricula"
            />
          </div>

          <div class="field-group">
            <label class="field-label">Senha de Acesso</label>
            <input
              type="password"
              class="field-input"
              placeholder="Digite sua senha"
              ng-model="credenciais.senha"
            />
          </div>

          <button
            type="button"
            class="button button-block btn-ucsal-primary"
            ng-click="fazerLogin()"
          >
            Acessar Portal Acadêmico
          </button>

          <div class="login-hint-box">
            <strong>Acesso de demonstração:</strong><br />
            Matrícula <span class="mono-code">20261001</span> • Senha <span class="mono-code">123456</span>
          </div>
        </div>
      </div>
    </div>
  </ion-content>
</ion-view>
