<ion-view view-title="Atualização Cadastral">
  <ion-content>
    <div class="portal-container">

      <div class="page-header-block">
        <div>
          <span class="page-eyebrow">Secretaria Geral de Cursos • Registro do Estudante</span>
          <h2 class="page-title">Ficha Cadastral e Endereço</h2>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-section-head">
          <h3>Vínculo Institucional</h3>
          <span>SOMENTE LEITURA</span>
        </div>

        <div class="panel-form-grid">
          <div class="col-span-full">
            <label class="field-label">Nome Completo do Estudante</label>
            <input type="text" class="field-input" ng-model="aluno.nome" ng-disabled="true" />
          </div>

          <div>
            <label class="field-label">Matrícula</label>
            <input type="text" class="field-input mono-code" ng-model="aluno.matricula" ng-disabled="true" />
          </div>

          <div>
            <label class="field-label">Curso de Graduação</label>
            <input type="text" class="field-input" ng-model="aluno.curso" ng-disabled="true" />
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="panel-section-head">
          <h3>Contatos e Endereço Residencial</h3>
          <span>CAMPOS EDITÁVEIS</span>
        </div>

        <div class="panel-form-grid">
          <div>
            <label class="field-label">E-mail Pessoal *</label>
            <input type="email" class="field-input" ng-model="aluno.email" placeholder="nome@exemplo.com" />
          </div>

          <div>
            <label class="field-label">Telefone / WhatsApp *</label>
            <input type="text" class="field-input mono-code" ng-model="aluno.telefone" placeholder="(71) 99999-9999" />
          </div>

          <div>
            <label class="field-label">CEP *</label>
            <input type="text" class="field-input mono-code" ng-model="aluno.endereco.cep" placeholder="00000-000" />
          </div>

          <div>
            <label class="field-label">Cidade / UF *</label>
            <input type="text" class="field-input" ng-model="aluno.endereco.cidade" placeholder="Salvador - BA" />
          </div>

          <div>
            <label class="field-label">Logradouro e Número *</label>
            <input type="text" class="field-input" ng-model="aluno.endereco.rua" placeholder="Rua / Avenida e número" />
          </div>

          <div>
            <label class="field-label">Bairro *</label>
            <input type="text" class="field-input" ng-model="aluno.endereco.bairro" placeholder="Ex.: Pituaçu" />
          </div>

          <div class="col-span-full" style="margin-top: 6px;">
            <button
              type="button"
              class="button button-block btn-ucsal-primary"
              ng-click="salvarCadastro()"
            >
              Salvar Alterações Cadastrais
            </button>
          </div>
        </div>
      </div>

    </div>
  </ion-content>
</ion-view>
