<ion-view view-title="Mural Acadêmico UCSal">
  <ion-content>
    <div class="portal-container">

      <div class="page-header-block">
        <div>
          <span class="page-eyebrow">Comunicação Institucional • Campi Pituaçu e Federação</span>
          <h2 class="page-title">Notícias e Atividades Acadêmicas</h2>
        </div>

        <div class="filter-pills">
          <button
            type="button"
            class="filter-pill-btn"
            ng-class="{'active': filtroCategoria === ''}"
            ng-click="selecionarCategoria('')"
          >
            Todas
          </button>
          <button
            type="button"
            class="filter-pill-btn"
            ng-class="{'active': filtroCategoria === 'Notícia'}"
            ng-click="selecionarCategoria('Notícia')"
          >
            Notícias
          </button>
          <button
            type="button"
            class="filter-pill-btn"
            ng-class="{'active': filtroCategoria === 'Evento'}"
            ng-click="selecionarCategoria('Evento')"
          >
            Eventos
          </button>
        </div>
      </div>

      <div class="news-grid">
        <article
          class="news-card"
          ng-repeat="item in publicacoes | filter:{ categoria: filtroCategoria }"
        >
          <div class="news-thumb-wrap">
            <img ng-src="{{ item.imagem }}" alt="{{ item.titulo }}" class="news-thumb" />
          </div>

          <div class="news-card-body">
            <div class="news-meta-row">
              <span
                class="badge-categoria"
                ng-class="item.categoria === 'Evento' ? 'badge-evento' : 'badge-noticia'"
              >
                {{ item.categoria }}
              </span>
              <span class="news-date">{{ item.data }}</span>
            </div>

            <h3 class="news-title">{{ item.titulo }}</h3>
            <p class="news-summary">{{ item.resumo }}</p>

            <div class="news-footer-bar">
              <span class="news-campus-tag">
                <i class="icon ion-ios-location-outline"></i> {{ item.campus }}
              </span>
              <button
                type="button"
                class="button btn-ucsal-outline"
                ng-click="abrirDetalhe(item.id)"
              >
                Ler mais
              </button>
            </div>
          </div>
        </article>
      </div>

    </div>
  </ion-content>
</ion-view>
