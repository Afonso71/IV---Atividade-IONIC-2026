<ion-view view-title="Mural UCSal">
  <ion-content class="padding">

    <div class="button-bar margin-bottom">
      <a
        class="button button-small"
        ng-class="filtroCategoria === '' ? 'button-ucsal' : 'button-stable'"
        ng-click="selecionarCategoria('')"
      >
        Todas
      </a>
      <a
        class="button button-small"
        ng-class="filtroCategoria === 'Notícia' ? 'button-ucsal' : 'button-stable'"
        ng-click="selecionarCategoria('Notícia')"
      >
        Notícias
      </a>
      <a
        class="button button-small"
        ng-class="filtroCategoria === 'Evento' ? 'button-ucsal' : 'button-stable'"
        ng-click="selecionarCategoria('Evento')"
      >
        Eventos
      </a>
    </div>

    <div
      class="list card"
      ng-repeat="item in publicacoes | filter:{ categoria: filtroCategoria }"
    >
      <div class="item item-divider" style="display:flex; justify-content:space-between; align-items:center;">
        <span
          class="badge-categoria"
          ng-class="item.categoria === 'Evento' ? 'badge-evento' : 'badge-noticia'"
        >
          {{ item.categoria }}
        </span>
        <span style="font-size:12px; color:#475569;">
          <i class="icon ion-calendar"></i> {{ item.data }} • {{ item.campus }}
        </span>
      </div>

      <div class="item item-image">
        <img ng-src="{{ item.imagem }}" alt="{{ item.titulo }}" class="news-cover" />
      </div>

      <div class="item item-body">
        <h2 style="margin-top:0; font-weight:700; color:#002B5C;">{{ item.titulo }}</h2>
        <p>{{ item.resumo }}</p>

        <button
          class="button button-small button-ucsal-light"
          ng-click="abrirDetalhe(item.id)"
        >
          Ler mais <i class="icon ion-arrow-right-c"></i>
        </button>
      </div>
    </div>

  </ion-content>
</ion-view>
