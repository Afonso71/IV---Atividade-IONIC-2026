<ion-view view-title="Detalhe da Publicação">
  <ion-content class="padding">
    <div class="list card" ng-if="publicacao">
      <div class="item item-image">
        <img ng-src="{{ publicacao.imagem }}" alt="{{ publicacao.titulo }}" class="news-cover" />
      </div>

      <div class="item item-body">
        <span
          class="badge-categoria"
          ng-class="publicacao.categoria === 'Evento' ? 'badge-evento' : 'badge-noticia'"
        >
          {{ publicacao.categoria }}
        </span>
        <span style="font-size:12px; color:#64748B; margin-left:8px;">
          {{ publicacao.data }} | {{ publicacao.campus }}
        </span>

        <h2 style="color:#002B5C; font-weight:700; margin-top:12px;">
          {{ publicacao.titulo }}
        </h2>

        <p style="line-height:1.6; color:#1E293B;">
          {{ publicacao.conteudo }}
        </p>
      </div>
    </div>
  </ion-content>
</ion-view>
