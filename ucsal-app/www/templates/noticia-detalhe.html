<ion-view view-title="Publicação Institucional">
  <ion-content>
    <div class="portal-container" ng-if="publicacao">
      <div class="panel-section">
        <div class="news-thumb-wrap" style="height: 260px;">
          <img ng-src="{{ publicacao.imagem }}" alt="{{ publicacao.titulo }}" class="news-thumb" />
        </div>

        <div style="padding: 24px;">
          <div class="news-meta-row">
            <span
              class="badge-categoria"
              ng-class="publicacao.categoria === 'Evento' ? 'badge-evento' : 'badge-noticia'"
            >
              {{ publicacao.categoria }}
            </span>
            <span class="news-date">{{ publicacao.data }} • {{ publicacao.campus }}</span>
          </div>

          <h2 class="page-title" style="margin: 10px 0 14px 0;">
            {{ publicacao.titulo }}
          </h2>

          <p style="font-size: 14px; line-height: 1.7; color: #334155;">
            {{ publicacao.conteudo }}
          </p>
        </div>
      </div>
    </div>
  </ion-content>
</ion-view>
