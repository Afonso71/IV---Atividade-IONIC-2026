<ion-side-menus enable-menu-with-back-views="true">
  <ion-side-menu-content>
    <ion-nav-bar class="bar-ucsal">
      <ion-nav-back-button class="button-clear" ng-click="voltarAoMural()">
        <i class="icon ion-ios-arrow-back"></i> Voltar
      </ion-nav-back-button>

      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left"></button>
      </ion-nav-buttons>
    </ion-nav-bar>

    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left" class="menu-sidebar-bg">
    <ion-content>
      <div class="menu-profile-box">
        <div class="menu-avatar-badge">AM</div>
        <h3>{{ aluno.nome || 'Afonso de Menezes Alves Neto' }}</h3>
        <span class="menu-matricula">MAT. {{ aluno.matricula || '20261001' }}</span>
        <span class="menu-curso">{{ aluno.curso || 'Engenharia de Software' }}</span>
      </div>

      <ion-list class="menu-nav-list">
        <ion-item menu-close href="#/app/noticias" ng-click="navegarPara('app.noticias')" class="item-icon-left">
          <i class="icon ion-ios-paper-outline"></i>
          Mural Acadêmico
        </ion-item>

        <ion-item menu-close href="#/app/perfil" ng-click="navegarPara('app.perfil')" class="item-icon-left">
          <i class="icon ion-ios-person-outline"></i>
          Dados Cadastrais
        </ion-item>

        <ion-item menu-close href="#/app/financeiro" ng-click="navegarPara('app.financeiro')" class="item-icon-left">
          <i class="icon ion-card"></i>
          Consulta Financeira
        </ion-item>

        <ion-item menu-close ng-click="sair()" class="item-icon-left item-logout">
          <i class="icon ion-log-out"></i>
          Encerrar Sessão
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-side-menu>
</ion-side-menus>
