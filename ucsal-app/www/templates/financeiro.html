<ion-view view-title="Consulta Financeira">
  <ion-content>
    <div class="portal-container">

      <div class="page-header-block">
        <div>
          <span class="page-eyebrow">Tesouraria Acadêmica • Demonstrativo de Mensalidades</span>
          <h2 class="page-title">Extrato Financeiro por Semestre</h2>
        </div>
      </div>

      <div class="finance-toolbar">
        <div>
          <label class="field-label">Semestre Letivo</label>
          <select
            class="select-control mono-code"
            ng-model="filtro.semestreSelecionado"
            ng-options="sem for sem in semestresDisponiveis"
            ng-change="carregarMensalidades()"
          ></select>
        </div>

        <div>
          <label class="field-label">Filtrar por Situação</label>
          <select class="select-control" ng-model="filtro.statusBusca">
            <option value="">Todas as Parcelas</option>
            <option value="Paga">Somente Pagas</option>
            <option value="A Pagar">Somente A Pagar</option>
          </select>
        </div>
      </div>

      <div class="invoice-list">
        <div
          class="invoice-card"
          ng-repeat="parcela in mensalidades | filter:{ status: filtro.statusBusca }"
          ng-class="parcela.status === 'Paga' ? 'invoice-paid' : 'invoice-pending'"
        >
          <div class="invoice-main-row">
            <div>
              <h3 class="invoice-month">{{ parcela.mes }}</h3>
              <p class="invoice-due">
                Vencimento: <span class="mono-code">{{ parcela.vencimento }}</span>
              </p>
            </div>

            <div class="invoice-right-col">
              <span class="invoice-amount">
                {{ parcela.valor | currency:"R$ " }}
              </span>
              <span
                class="status-badge"
                ng-class="parcela.status === 'Paga' ? 'status-paga' : 'status-apagar'"
              >
                {{ parcela.status }}
              </span>
            </div>
          </div>

          <div class="invoice-barcode-Drawer" ng-if="parcela.status === 'A Pagar'">
            <span class="barcode-preview">{{ parcela.codigoBarras }}</span>
            <button
              type="button"
              class="button btn-ucsal-outline"
              ng-click="copiarCodigoBarras(parcela)"
            >
              <i class="icon ion-ios-barcode-outline"></i> Copiar Código de Barras
            </button>
          </div>
        </div>
      </div>

    </div>
  </ion-content>
</ion-view>
